{% extends 'tracker/base.html' %}
{% block title %}Login — Expense Tracker{% endblock %}
{% block content %}
<div style="max-width:400px;margin:60px auto">
  <div style="text-align:center;margin-bottom:32px">
    <div style="font-size:40px;margin-bottom:8px">💰</div>
    <div style="font-size:24px;font-weight:800">Expense<span style="color:var(--green)">.</span></div>
    <div style="font-size:13px;color:var(--muted);margin-top:4px">Track your money. Own your future.</div>
  </div>
  <div class="form-card">
    <div class="card-title">Sign In</div>
    {% if form.errors %}
    <div class="msg error">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><label>Username</label><input type="text" name="username" autofocus placeholder="Enter username"></div>
      <div class="field"><label>Password</label><input type="password" name="password" placeholder="Enter password"></div>
      <button type="submit" class="btn-primary">Sign In →</button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted)">
      No account? <a href="{% url 'register' %}" style="color:var(--green);font-weight:600">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
